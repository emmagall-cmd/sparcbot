# =============================================================================
# SPARCBot parameters — the ONE place every robot value lives.
#
# Read by:
#   * the ROS 2 nodes (passed in by sparcbot_bringup/launch/robot.launch.py)
#
# Nested keys become dotted parameter names, e.g. left_motor.gpio_dir.
#
# Rules of thumb:
#   * Write every floating-point value with a decimal point (1.0, not 1).
# =============================================================================

# -----------------------------------------------------------------------------
# Hardware driver: motors, encoders, wheel-state estimator.
# -----------------------------------------------------------------------------
sparcbot_driver:
  ros__parameters:
    control_rate_hz: 100.0      # encoder read + /wheel_states publish rate
    cmd_timeout_s: 0.1          # coast if no /wheel_cmd for this long (<= 0 disables)

    counts_per_rev: 500.0       # encoder counts per gearbox output revolution
    velocity_cutoff_hz: 4.5     # Lower cutoff frequency to filter out discrete count quantization hash

    # Wiring. Signs make "positive command" and "positive
    # encoder motion" both mean robot-forward wheel motion.
    left_motor:
      name: left
      gpio_dir: 23
      gpio_ps: 24
      gpio_enc_a: 17
      gpio_enc_b: 27
      pwm_chip: 0
      pwm_channel: 0
      pwm_frequency_hz: 20000
      motor_sign: -1
      encoder_sign: -1

    right_motor:
      name: right
      gpio_dir: 22
      gpio_ps: 25
      gpio_enc_a: 5
      gpio_enc_b: 6
      pwm_chip: 0
      pwm_channel: 1
      pwm_frequency_hz: 20000
      motor_sign: -1
      encoder_sign: 1

# -----------------------------------------------------------------------------
# Robot geometry shared by every node (`/**` applies to all nodes).
# -----------------------------------------------------------------------------
/**:
  ros__parameters:
    base_width_m: 0.175         # wheel-to-wheel distance (measure on your robot)
    wheel_radius_m: 0.040       # drive wheel radius

# -----------------------------------------------------------------------------
# Encoder odometry (/odom and the odom -> base_link transform).
# Also uses base_width_m and wheel_radius_m from the shared block above.
# -----------------------------------------------------------------------------
odometry:
  ros__parameters:
    odom_frame_id: odom
    base_frame_id: base_link
    publish_tf: true            # set false if another node is doing it

# -----------------------------------------------------------------------------
# Wheel velocity controller (feedforward + PID), one block per wheel.
# -----------------------------------------------------------------------------
wheel_controller:
  ros__parameters:
    # CSV file for WheelController.log() (call it inside compute()); '' disables logging.
    # Use an absolute path, e.g. /home/sparcbot/logs/ff_sweep.csv
    log_file: ''

    left:
      # Reduced Kp to stop amplifying discrete encoder tick jumps into the PWM command
      kp: 2.8
      # Modest Ki to bring steady-state error to zero smoothly without hunting
      ki: 4.0
      # Zeroed Kd to remove high-frequency derivative chatter
      kd: 0.0
      feedforward:
        forward_static: 0.10            # Overcomes motor gearbox stiction
        forward_velocity_gain: 0.85     # Duty cycle per m/s (1.0 duty / ~0.8 m/s top speed)
        reverse_static: 0.10
        reverse_velocity_gain: 0.85
        forward_breakaway: 0.12
        reverse_breakaway: 0.12
        stopped_velocity_threshold: 0.015
        max_command: 1.0
        zero_velocity_threshold: 0.0005

    right:
      kp: 2.0
      ki: 3.0
      kd: 0.0
      feedforward:
        forward_static: 0.06
        forward_velocity_gain: 1.05
        reverse_static: 0.06
        reverse_velocity_gain: 1.05
        forward_breakaway: 0.08
        reverse_breakaway: 0.08
        stopped_velocity_threshold: 0.008
        max_command: 1.0
        zero_velocity_threshold: 0.0005